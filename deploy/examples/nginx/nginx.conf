# Place these directives inside nginx's http context.
limit_req_zone $binary_remote_addr zone=rilgate_requests:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=rilgate_proofs:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=rilgate_connections:10m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name example.com;
    client_max_body_size 16m;
    client_header_timeout 10s;
    client_body_timeout 30s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn rilgate_connections 32;

    location = /.well-known/rilgate/api/metrics { return 404; }
    location = /.well-known/rilgate/api/health { return 404; }
    location = /.well-known/rilgate/api/ready { return 404; }
    location = /.well-known/rilgate/api/live { return 404; }

    location / {
        limit_req zone=rilgate_requests burst=40 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location ~ ^/\.well-known/rilgate/api/(challenge|verify|exchange|ws)$ {
        limit_req zone=rilgate_proofs burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
