services:
  rilgate:
    container_name: rilgate
    image: rilgate:local
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    volumes:
      - ../../config/rilgate.production.yml:/app/config/rilgate.yml:ro
    environment:
      RILGATE_SECRET: "${RILGATE_SECRET:?Set RILGATE_SECRET}"
      RILGATE_UPSTREAM_URL: "http://host.docker.internal:3000"
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 2
    stop_grace_period: 45s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
