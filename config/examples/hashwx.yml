server:
  upstream:
    url: "http://127.0.0.1:3000"
security:
  secret: "${RILGATE_SECURITY_SECRET}"
pow:
  default_algorithm: hashwx
  algorithms:
    hashwx:
      nonces_per_seed: 65536
      # Defaults target about 2 seconds on a mid-range phone.
      difficulty:
        base: 610000
        score_step: 10
        max: 2440000
policy:
  default_action: challenge
