server:
  upstream:
    url: "http://127.0.0.1:3000"
security:
  secret: "${RILGATE_SECURITY_SECRET}"
pow:
  # stratum_pool_accepted requires actual share acceptance over the owning WebSocket.
  verification: local_verify
  default_algorithm: randomx
  stratum_pool:
    pools:
      - name: local
        address: "127.0.0.1:3333"
        login: {user: "x+{difficulty}", password: x}
    job_sessions:
      mode: pooled
      max: 16
policy:
  mode: custom
  default_action: challenge
