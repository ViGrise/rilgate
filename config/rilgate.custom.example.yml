server:
  upstream:
    url: "http://127.0.0.1:3000"
security:
  secret: "${RILGATE_SECURITY_SECRET}"
policy:
  mode: custom
  default_action: allow
  # Remote feeds need outbound HTTPS; readiness fails until each has loaded once.
  ip_sets:
    google-common-crawlers:
      url: "https://developers.google.com/static/crawling/ipranges/common-crawlers.json"
      format: ip_prefixes_json
      refresh: 24h
      max_stale: 7d
  rules:
    - name: verified-google-crawler
      when:
        all:
          - client_ip:
              in_sets: [google-common-crawlers]
          - user_agent:
              contains: Googlebot
      action: allow
    - name: public-endpoints
      when:
        any:
          - path:
              prefix: "/.well-known/"
          - path:
              in: ["/favicon.ico", "/robots.txt"]
          - path:
              regex: '(?i)\.(rss|xml|atom)$'
      action: allow
    - name: blocked-scraper
      when:
        user_agent:
          regex: "(?i:badbot)"
      action: deny
    - name: browser-score
      when:
        user_agent:
          regex: "Mozilla|Opera"
      action: score
      score: 10
    - name: suspicious-header
      when:
        headers:
          X-Suspicious:
            regex: ".+"
      action: score
      score: 10
    - name: trusted-network
      when:
        all:
          - client_ip:
              cidr: 192.0.2.0/24
          - method:
              exact: GET
          - not:
              path:
                prefix: /admin/
      action: score
      score: -10
    - name: protected-endpoint
      when:
        path:
          prefix: /protected/
      action: challenge
      challenge:
        algorithm: fast
        difficulty: 2
  score:
    initial: 0
    debug_header:
      enabled: false
      name: x-pow-weight
    thresholds:
      - min: 20
        action: challenge
        challenge:
          algorithm: fast
          difficulty: 4
      - min: 10
        action: challenge
        challenge:
          algorithm: fast
          difficulty: 2
      - min: 1
        action: challenge
        challenge:
          algorithm: fast
          difficulty: 1
