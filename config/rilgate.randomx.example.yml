server:
  upstream:
    url: "http://127.0.0.1:3000"
security:
  secret: "${RILGATE_SECRET}"
pow:
  # p2pool_accepted requires actual share acceptance over the owning WebSocket.
  verification: local_verify
  default_algorithm: randomx
  p2pool:
    address: "127.0.0.1:3333"
    job_sessions:
      mode: pooled
      max: 16
policy:
  mode: custom
  default_action: challenge
