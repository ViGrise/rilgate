# Rilgate configuration

# Getting started:
#   1. Copy this file to rilgate.yml in the directory you run rilgate from.
#   2. Set server.upstream.url to your application.
#   3. Export RILGATE_SECURITY_SECRET with a cryptographically random secret,
#      so access cookies stay valid across restarts and instances:
#        export RILGATE_SECURITY_SECRET="$(openssl rand -hex 32)"
#   4. Run: rilgate config check

# Only the upstream URL is required. Without a signing secret, each start uses a
# random one. Embedded pages, assets, translations, Fast SHA-256 proofs and the
# balanced policy work without Stratum pool.
# Optional settings are commented out. Remove the comment marker from the YAML
# setting and its parent mappings to enable it; retain the YAML indentation.
# Descriptions appear immediately above their settings, separated by a blank
# comment line. Values shown are defaults unless marked as examples.

# Durations use units: 300ms, 5s, 1m, 6h. They must be positive and at most 365d.
# Token lifetimes require whole seconds; network timeouts accept subsecond values.
# Sizes use positive integer quantities: 1024B, 1KiB, 16MiB, 1GiB.
# Environment references use ${VARIABLE_NAME} inside scalar values. Missing or
# empty variables fail validation. Expansion is single-pass, without shell syntax.
# YAML types remain strict and unknown keys are rejected, including in development.

# Every scalar setting also has a RILGATE_* variable and a flag named after its
# path: server.upstream.url is RILGATE_SERVER_UPSTREAM_URL or
# --server-upstream-url. Flags override variables, which override this file.
# .env.example lists every variable; rilgate --help lists every flag.
# A working-directory .env, or --env-file, supplies variables without replacing
# existing ones.
# Configuration is loaded at startup. SIGHUP on Unix, the reload command and
# server.watch_config reload the signals and policy sections
# without a restart. A change to any other section needs a restart; Rilgate then
# logs the section names and keeps the running configuration.

# Rilgate reads rilgate.yml from the working directory, then config/rilgate.yml.
# Select another file with --config FILE or RILGATE_CONFIG.
# Check the file: rilgate config check
# Inspect resolved values: rilgate config show
# Include all defaults: append --defaults to config show. Secrets are redacted.
# Redacted output is for inspection and cannot replace the original secret values.

################################# ENVIRONMENT #################################

# production: Secure authentication cookies and no client-controlled score header.
# Serve production traffic through HTTPS, normally at a trusted reverse proxy.
# development: permits local HTTP cookies and the optional score debug header.
# Signing keys must meet the same strength requirements in either environment.
#
# environment: production

#################################### SERVER ###################################

server:
  # Bind address, or a list of up to 16 addresses. ':8080' listens on all IPv4
  # interfaces. Use '127.0.0.1:8080' behind a local edge.
  # '[::]:8080' accepts IPv4 and IPv6 on every operating system, unless the list
  # also holds ':8080' or '0.0.0.0:8080' (same port), which then serves IPv4 and
  # '[::]:8080' serves IPv6 only. Any other IPv6 address is IPv6 only.
  # Example list: [":8080", "[::]:8443"]. --server-listen and
  # RILGATE_SERVER_LISTEN take a comma-separated list.
  # --port replaces the port of every address.
  # Hostnames are not supported here; use an IP address and port.
  #
  # listen: ":8080"

  # Watch configuration files for signals and policy changes
  # Changes are applied after a 500 ms quiet period.
  #
  # watch_config: false

  operations:
    # Operational routes are served only here, relative to site.base_path.
    # An empty list disables them. Use loopback or a private monitoring network.
    # Accepts one address or up to 16 unique addresses, distinct from server.listen.
    # Example: "127.0.0.1:9090". --port preserves these addresses.
    #
    # Example, not a default.
    #
    listen: "127.0.0.1:9090"

    # Enable POST {site.base_path}/reload on this listener.
    # Requests with an Origin header receive 403. Keep this listener private.
    #
    # reload: false

  upstream:
    # REQUIRED. HTTP or HTTPS application URL, optionally including a base path.
    # Credentials, query strings and fragments are forbidden. No default URL.
    #
    # Example, not a default.
    #
    url: "http://127.0.0.1:3000"

    # Forward the incoming Host header. Set false to use the upstream authority.
    # HTTPS certificate verification still uses the configured upstream hostname.
    #
    # preserve_host: true

    # Maximum incoming proxied body size. Upstream responses remain streamed.
    # Oversized requests receive 413. With an unknown-length streaming body,
    # earlier bytes may already have reached the upstream before the limit is hit.
    #
    # max_body_size: 16MiB

    # timeout:
      # Per-attempt upstream connection timeout, within the overall connection
      # budget of 30s. DNS resolution and connection setup consume that budget.
      #
      # connect: 5s

      # Upstream read/write inactivity timeout, not a total response lifetime.
      # A timeout before response headers returns 504; during a response it
      # terminates the stream, since headers have already been sent.
      #
      # read: 30s

  # Maximum accepted TCP connections, including idle connections. Range: 1..1000000.
  # Excess connections are closed before request processing.
  #
  # max_connections: 1024

  # Maximum concurrent requests. Streaming responses and upgraded WebSockets hold
  # their slot until completion. Excess requests receive 503 with Retry-After.
  # Range: 1..1000000. This is independent of the TCP connection limit.
  #
  # max_requests: 512

  # Maximum concurrent HTTP/2 streams advertised per connection. Range: 1..1024.
  # The process-wide max_requests limit also applies across all connections.
  #
  # h2_max_streams: 64

  # Trusted immediate proxy peers, as IPv4/IPv6 CIDRs; at most 64 networks.
  # Empty means no peer can supply the client IP through forwarding headers.
  # When used, X-Forwarded-For is read right-to-left to the nearest untrusted hop.
  # The resolved IP drives both policy matching and per-client proof quotas.
  # Trust only actual edge proxies, which must overwrite incoming forwarding data.
  # Example: ["127.0.0.1/32", "::1/128"]. Forwarded is not used for client identity.
  #
  # trusted_proxies: []

  # Optional HTTP header with one client IP address, read only from trusted peers.
  # The edge must overwrite this header with a single IP address. Duplicate values
  # and address lists are rejected. X-Forwarded-For applies when the header is absent.
  #
  # Example, not a default.
  #
  # client_ip_header: cf-connecting-ip

  # Policy decisions logged at info level: off, deny, challenge or all.
  # challenge includes denied requests; all also includes allowed requests.
  # These lines contain client IP addresses, request paths and policy details.
  #
  # decision_log: challenge

  # Enable Prometheus metrics at <site.base_path>/api/metrics; false returns 404.
  # This endpoint has no application authentication. Restrict access at the edge.
  # Labels are bounded; request paths and client identities are not metric labels.
  #
  # metrics_enabled: false

  # Dependency-probe timeout for <site.base_path>/api/ready. Maximum: 30s.
  # Readiness probes TCP reachability of the upstream and, when required by the
  # selected challenges, a Stratum pool through its proxies and TLS. This does
  # not check application response health or Stratum login.
  # <site.base_path>/api/live only reports process liveness.
  #
  # readiness_timeout: 2s

################################### SECURITY ##################################

# security:
  # Master secret of at least 32 bytes of high-entropy data.
  # HKDF-SHA256 derives independent challenge and authentication signing keys.
  # Keep the secret outside source control. Changing it invalidates existing
  # signatures. Instances sharing this secret and compatible verification settings
  # can verify each other's local proofs and authentication tokens.
  # Without secret and keys, each start generates a random secret: access cookies
  # end at restart and other instances cannot verify them.
  #
  # secret: "${RILGATE_SECURITY_SECRET}"

  # Alternative explicit-key mode. Remove secret above AND unset RILGATE_SECURITY_SECRET
  # before enabling keys. Both challenge and auth are required, each at least
  # 32 bytes. These are direct signing secrets, rather than a master derivation key.
  #
  # keys:
    # Signs challenge presentation, work and verification receipts.
    #
    # challenge: "${RILGATE_SECURITY_KEYS_CHALLENGE}"

    # Signs authentication tokens, independently of the challenge key.
    #
    # auth: "${RILGATE_SECURITY_KEYS_AUTH}"

    # Rotation is optional and available independently for each explicit key.
    # Defaults: no active_id and no previous keys, issuing unversioned tokens.
    #
    # challenge_rotation:
      # Setting it issues tokens with a signed key ID.
      # Use ASCII letters, digits, '_' or '-'. Length: Range: 1..32. 'legacy' is reserved.
      # Assign a new ID whenever changing the active signing secret.
      #
      # Example, not a default.
      #
      # active_id: primary-1

      # At most 8 ID-to-secret entries, each at least 32 bytes, for verification
      # only. An ID cannot also be active_id. Example instead of '{}':
      #
      # Example, not a default.
      #
      # previous:
      #   primary-0: "${RILGATE_SECURITY_KEYS_CHALLENGE_PREVIOUS}"
      # Use the reserved ID 'legacy' to accept old unversioned tokens explicitly.
      #
      # previous: {}
    # auth_rotation:
      # Current auth secret ID; same syntax as challenge IDs.
      # Example, not a default.
      #
      # active_id: primary-1

      # Verification-only auth keys. Example instead of '{}':
      #
      # Example, not a default.
      #
      # previous:
      #   primary-0: "${RILGATE_SECURITY_KEYS_AUTH_PREVIOUS}"
      #
      # previous: {}

  # For rolling rotation, first distribute verification keys to every instance,
  # then switch issuance to the new ID. Retire old verification keys only after
  # all tokens signed by them have expired, allowing for rollout time and skew.

  # auth:
    # Cookie name, using valid HTTP token characters. Cookies are host-scoped,
    # HttpOnly and SameSite=Lax, with Secure enabled in production.
    #
    # cookie: rilgate_auth

    # Access lifetime, anchored to receipt issuance; repeated receipt exchange
    # cannot extend it. Positive whole seconds, at most 365d.
    # A valid cookie still cannot bypass a deny rule or a stronger challenge.
    #
    # ttl: 6h

    # Binds the cookie to the client that solved the challenge. Without binding, a
    # cookie is a portable bearer credential that works from any machine until it
    # expires. A bound cookie from a different client gets the challenge instead.
    # Each enabled component is hashed with a key derived from the active auth
    # signing key; changing that key makes bound clients solve again.
    #
    # bind:
      # Bind to the client network. Present, even as '{}', enables IP binding.
      # The resolved client IP is used, so server.trusted_proxies must be correct.
      # Mobile and VPN users solve again when their network changes.
      #
      # client_ip:
        # Leading IPv4 bits that must match. Range: 0..32. A value of 24 binds the /24 network.
        # Setting this or ipv6_prefix enables IP binding.
        #
        # ipv4_prefix: 24

        # Leading IPv6 bits that must match. Range: 0..128. A value of 64 binds the /64 network.
        # Setting this or ipv4_prefix enables IP binding.
        #
        # ipv6_prefix: 64

        # Maximum remembered client networks. Range: 1..8. Default 1 keeps one network.
        # Each new network needs a solved challenge; entries expire independently.
        # Merged cookies use the lower difficulty. A different bound User-Agent
        # family or algorithm starts a new cookie. Deploy the same version on every
        # gateway instance before raising this value; older instances challenge again.
        #
        # max_networks: 1

      # Bind to the User-Agent header. Absent means not bound. 'full' requires the
      # exact value; 'family' ignores version numbers, so browser updates keep
      # the cookie valid while a different browser needs a new solve.
      #
      # user_agent: family

      # Client request headers to bind, read on every request, at most 16 names.
      # A missing header differs from an empty one. Example: [accept-language]
      #
      # headers: []

      # Headers set by an edge proxy, such as a JA4 TLS fingerprint, at most 16
      # names. They are read only when the immediate TCP peer is inside
      # server.trusted_proxies and are ignored from any other peer.
      # Example: [x-ja4]
      #
      # proxy_headers: []

##################################### SITE ####################################

# site:
  # Display name used by challenge pages. Control characters are forbidden.
  #
  # name: Rilgate

  # Public site/branding URL, not the upstream. HTTP/HTTPS without credentials.
  #
  # url: https://rilgate.com

  # Reserved prefix for proof APIs and assets. Use an absolute, non-root path
  # without a trailing slash, dot segments, query or fragment. Internal routing
  # runs before user policies; unknown internal routes return 404.
  #
  # base_path: /.well-known/rilgate

  # Logical stylesheet path under static resources, or an absolute HTTP/HTTPS URL.
  # The bundled default resolves to static/css/rilgate.css.
  #
  # stylesheet: css/rilgate.css

  # Hash-based Content Security Policy for HTML pages. External stylesheet origins
  # are included automatically. JSON responses have no CSP header.
  #
  # content_security_policy:
    # enabled: true

    # Additional CSP source expressions, YAML only. Supported directives are listed
    # below. Each list allows up to 16 nonempty sources without whitespace, ; or ,.
    #
    # extra_sources:
      # script-src: []
      # style-src: []
      # img-src: []
      # font-src: []
      # connect-src: []

  # Challenge and denial response formats. auto honors explicit Accept preferences;
  # otherwise JSON Content-Type (including application/*+json) or X-Requested-With:
  # XMLHttpRequest selects JSON. Ordinary page navigation receives HTML.
  # JSON challenges return 403 with Rilgate-Challenge and Rilgate-Challenge-Url
  # headers. The client opens the URL, solves the challenge, then retries its
  # original request. No intercepted upload is automatically replayed.
  #
  # responses:
    # auto, html or json. html keeps browser pages and plain 401 for unsafe methods;
    # json always uses the JSON templates for challenge and denial responses.
    #
    # format: auto

    # HTML challenge status: 200, 401, 403, 429 or 503.
    # JSON challenges always return 403 with Rilgate-Challenge: required.
    # Use 403 behind a CDN or service worker that ignores Cache-Control: no-store,
    # so that it does not store a challenge page as the requested resource.
    #
    # challenge_status: 200

    # HTML and JSON denial status: 403, 404, 410 or 429.
    #
    # deny_status: 403

    # Optional API path prefixes that always receive JSON in auto mode, even if
    # a client sends Accept: text/html. Matches whole path segments: /api matches
    # /api and /api/users, but not /apiary. Up to 64 absolute paths; no escapes,
    # query, fragment or dot segments. Cannot be combined with format: html.
    # Example: [/api, /graphql]. Empty means use request headers only.
    #
    # json_paths: []

  # Customize JSON bodies with templates/pages/challenge.json.jinja and
  # templates/pages/denied.json.jinja in the external resource directory below.
  # Use the tojson filter for dynamic values. Templates may use an application's
  # own envelope and field names; rendered output must be a valid JSON object.
  # See docs/web.md for the same-origin iframe completion protocol.

  # Anonymous preview metadata for HTML GET challenges. Fetches continue after
  # the response wait deadline and share a bounded in-memory cache.
  #
  # open_graph:
    # Enable anonymous preview metadata in HTML GET challenges.
    #
    # enabled: false

    # Cache lifetime for successful pages, including pages without tags. Range: 1m..7d.
    #
    # ttl: 24h

    # Cache lifetime for failed lookups. Range: 10s..ttl.
    #
    # negative_ttl: 5m

    # Maximum response wait; the fetch continues and fills the cache. Range: 100ms..10s.
    #
    # timeout: 2s

    # Maximum cached pages per process. Range: 1..1000000.
    #
    # max_entries: 10000

    # Include the query in the cache key and prefetch URL.
    #
    # include_query: false

    # Replace the prefetch header map. Client headers are never copied. At most 16 headers.
    #
    # request_headers:
      # user-agent: Rilgate-OpenGraph/1.0
      # x-forwarded-host: "{host}"
      # x-forwarded-proto: https

    # Select tag prefixes and whole names. Each list replaces its default independently.
    #
    # tags:
      # Tag-name prefixes in lowercase. At most 16 entries.
      #
      # prefixes: ["og:", "twitter:", "fediverse:"]

      # Whole tag names in lowercase. At most 32 entries.
      #
      # names: [description, keywords, author]

    # Select requests with policy conditions. Unknown conditions skip the lookup.
    #
    # Example, not a default.
    #
    # when:
      # not: {path: {prefix: /admin/}}

    # Render configured tags without fetching. At most 32 entries.
    #
    # override: {}

  # resources:
    # Omitted means embedded-only.
    # External templates/, static/ and i18n/ overlay embedded resources.
    # Relative directories resolve from the process working directory.
    # Symlinks are rejected. Startup can fall back to embedded resources when
    # overrides are invalid; use 'rilgate ... web validate' to check them.
    #
    # Example, not a default.
    #
    # directory: /etc/rilgate/web

    # if_empty seeds embedded files only into an empty external directory.
    # Hidden files make it nonempty; existing contents are never overwritten.
    # never disables seeding. No directory means there is nothing to seed.
    #
    # seed: if_empty
    # watch:
      # Watch external files and atomically publish valid resource snapshots.
      # Invalid reloads retain the previous snapshot. Embedded-only mode has
      # no watcher. On Unix, SIGHUP can also trigger a resource reload.
      #
      # enabled: false

      # Coalesce nearby filesystem events. Must be positive and at most 60s.
      #
      # debounce: 300ms

  # templates:
    # In-memory compiled template cache. Currently must be true; false is
    # unsupported. This does not enable browser caching of challenge responses.
    #
    # cache: true

    # Undefined template variables produce errors instead of empty output.
    #
    # strict: true

    # Maximum nested template recursion, including includes. Range: 1..256.
    #
    # recursion_limit: 64

    # Positive instruction budget per template evaluation, bounding rendering
    # work such as loops. Increase only for trusted, more complex templates.
    #
    # fuel: 50000

  # i18n:
    # Default/fallback BCP 47 locale tag. Must be included in supported when an
    # explicit supported list is supplied, and available in loaded resources.
    #
    # default: en

    # Empty or omitted discovers locales from translation files. A nonempty
    # list restricts offered locales, for example [en, vi].
    #
    # supported: []

    # Treat missing translation keys as validation errors. With false, missing
    # keys are reported while locale/default/English fallback remains available.
    #
    # strict: false

    # Language preference cookie name, using valid HTTP token characters.
    # Selection order: ?lang, language cookie, Accept-Language, default locale.
    #
    # cookie: rilgate_lang

################################ PROOF OF WORK ################################

# pow:
  # local_verify checks Fast SHA-256 or RandomX proofs on this gateway.
  # Compatible signed local proofs can be verified across instances.
  # stratum_pool_accepted requires RandomX challenges and an actual accepted share
  # response from the mining pool, through a retained WebSocket/Stratum session. HTTP
  # RandomX issue/verify is unavailable in that mode. Route sessions back to
  # their owning gateway; there is no distributed session store.
  #
  # verification: local_verify

  # Algorithm when a challenge action omits algorithm: fast, hashwx or randomx.
  # refresh is not allowed here because it needs an explicit delay in a policy rule.
  # Presets explicitly select fast. Selecting RandomX requires explicit Stratum pool
  # configuration for jobs, including when verification is local.
  #
  # default_algorithm: fast

  # challenge:
    # Challenge presentation token and Fast work lifetime. Whole seconds only.
    #
    # ttl: 1m

    # Window for exchanging a verified receipt for authentication. Whole seconds.
    #
    # receipt_ttl: 30s

  # rate_limit:
    # Apply per-client and global token buckets to proof HTTP APIs and WebSocket
    # handshakes. Ordinary proxied requests use server admission limits instead.
    # Quotas are per gateway process, not shared across a deployment.
    #
    # enabled: true

    # Maximum tracked client-IP buckets, bounding memory. Range: 1..65536.
    # If no bucket can be reclaimed at capacity, new clients are rate limited.
    #
    # max_clients: 4096
    # client:
      # Per-client initial token count and bucket capacity. Range: 1..1000000.
      #
      # burst: 10

      # Tokens restored per second; 0.1 means one token every 10 seconds.
      # Must be finite. Range: 0.001..1000000.
      #
      # refill_per_second: 0.1
    # global:
      # Shared initial tokens and capacity across clients. Range: 1..1000000.
      #
      # burst: 64

      # Process-wide replenishment rate. Must be finite. Range: 0.001..1000000.
      #
      # refill_per_second: 16

  # algorithms:
    # Fast has no algorithm-specific configuration. RandomX is opt-in and uses
    # substantially more browser/server memory and CPU than Fast.
    #
    # hashwx:
      # Signed batch size. Range: 463..1048576.
      #
      # nonces_per_seed: 65536

      # Difficulty defaults stay provisional until a mid-range phone is measured.
      #
      # difficulty:
        # Positive base difficulty, at most 2^40.
        #
        # base: 50000

        # Positive score interval that doubles difficulty.
        #
        # score_step: 10

        # At least base and at most 2^40.
        #
        # max: 5000000

    # randomx:
      # Signed RandomX work lifetime for local verification, separate from the
      # shorter presentation-token TTL. Positive whole seconds, at most 365d.
      #
      # challenge_ttl: 1h

      # Byte offset of the 4-byte nonce in the mining blob. Range: 0..252.
      # it must also fit the actual Stratum pool job blob. 39 is the Monero layout.
      #
      # nonce_offset: 39

      # Pending native verification jobs, serviced by a dedicated worker.
      # Range: 1..1024. A full queue returns 503 rather than growing unbounded.
      #
      # verifier_queue: 8

      # Dedicated verifier settings. Use `rilgate verifier serve` and keep this
      # section absent when this process runs the gateway. Worker count must be 1.
      #
      # Example, not a default.
      #
      # serve:
        # Verifier bind address.
        #
        # listen: 127.0.0.1:9443

        # Verifier worker count.
        #
        # workers: 1

        # Pending verifier job capacity.
        #
        # queue: 64

        # Maximum concurrent verifier connections.
        #
        # max_connections: 256

        # Mutual TLS credentials.
        #
        # tls:
          # Verifier certificate file.
          #
          # cert: /etc/rilgate/verifier.pem

          # Verifier private key file.
          #
          # key: /etc/rilgate/verifier.key

          # Trusted gateway certificate authority file.
          #
          # client_ca: /etc/rilgate/gateway-ca.pem
      # cache:
        # Idle time before releasing the native cache. Range: 0s..7d.
        # 0s keeps the cache resident. The next request rebuilds it.
        #
        # idle_timeout: 30m

      # verify:
        # One or two distinct hashers, tried in order on unavailability.
        # A returned hash or invalid request ends the sequence.
        #
        # order: [local]
        # remote:
          # Required when order contains remote. HTTPS origin without a path,
          # query or credentials. Development also accepts HTTP.
          #
          # endpoint: https://verifier.internal:9443

          # Certificate name to verify; defaults to the endpoint host.
          #
          # server_name: verifier.internal

          # Total request budget, including response reads. Range: 100ms..30s.
          # The challenge expiry also limits the request.
          #
          # timeout: 2s

          # Action when the verifier rejects the request deadline: fallback or reject.
          # fallback tries the next hasher; reject returns 401.
          #
          # on_deadline_rejected: fallback

          # Mutual TLS credentials.
          #
          # tls:
            # Private trust roots in PEM format. Required in production.
            #
            # ca: /etc/rilgate/verifier-ca.pem

            # Gateway identity PEM files. Set both or neither;
            # production requires both.
            #
            # client_cert: /etc/rilgate/gateway.pem

            # Private key for the gateway identity, in PEM format.
            #
            # client_key: /etc/rilgate/gateway.key

      # difficulty:
        # Minimum automatic difficulty, at least 1000.
        #
        # base: 1000

        # Positive integer score interval per doubling. Automatic difficulty is
        # base * 2^(score / score_step), with integer division and exponent
        # clamped before the max cap. Range: 0..63. Negative scores keep base.
        #
        # score_step: 10

        # Maximum automatic difficulty, at least base. An explicit challenge
        # difficulty bypasses this calculation/cap, but must still be >= 1000.
        #
        # max: 32000

      # Browser RandomX solver settings.
      #
      # browser:
        # Solver module under site.base_path, even with the leading '/'.
        # Must be a local safe resource path, not an arbitrary external URL.
        #
        # module: /static/js/solvers/randomx/solver.js

        # Maximum browser workers. Range: 1..8. CPU and memory can reduce this count.
        #
        # max_workers: 8

        # Store the seed cache in IndexedDB for reuse across solves.
        #
        # store_cache: true

      # Optional fallback while every pool is in its failure cooldown.
      # Both fields are required. Requires local_verify and an enabled algorithm.
      #
      # fallback:
        # algorithm: fast

        # Difficulty scaling settings.
        #
        # difficulty: 4

  # Omitted by default. Required whenever RandomX jobs or pool acceptance are
  # selected. Merely adding this section does not switch the policy to RandomX.
  #
  # stratum_pool:
    # Pools are tried in this order. Range: 1..8. Each name must be
    # unique. Length: Range: 1..64. Use lowercase letters, digits, hyphens or underscores.
    # Each address is HOST:PORT or [IPv6]:PORT, with no scheme or credentials.
    #
    # Example, not a default.
    #
    # pools:
      # - name: local
        #
        # address: 127.0.0.1:3333
        # login:
          # Exactly one {difficulty} is required. No other placeholders are
          # allowed. The substituted login must fit in 256 bytes.
          # P2Pool sets its wallet on the node. Other pools can need a wallet
          # in this template. Use an environment reference for private data.
          #
          # user: "x+{difficulty}"
          # password: x

        # Mutual TLS credentials.
        #
        # tls:
          # Production requires TLS for hosts outside private networks.
          # Certificate verification is always on. The address host is the
          # default server_name. Without ca, Rilgate uses webpki roots.
          #
          # enabled: false
          # server_name: pool.example
          # ca: /etc/rilgate/pool-ca.pem

        # An empty list connects directly. An omitted list uses the shared
        # proxies below. A nonempty list replaces the shared list.
        # Example, not a default.
        #
        # proxies: []

    # Shared proxies, tried in order. Range: 0..8. Each name follows
    # the pool name rules. Credentials must be in both fields, or neither.
    # URL schemes: socks5 (local DNS), socks5h (proxy DNS), http (CONNECT).
    # TLS to the pool stays end to end through the proxy.
    #
    # Example, not a default.
    #
    # proxies:
      # - name: tunnel
        #
        # url: socks5h://127.0.0.1:1080
        # username: "${RILGATE_STRATUM_PROXY_USERNAME}"
        # password: "${RILGATE_STRATUM_PROXY_PASSWORD}"

    # Limits for ordered pool and proxy connection attempts.
    #
    # failover:
      # Total time across all pools and proxies, including login. Range: 1s..5m.
      # Must be at least timeout.connect. A request stopped by this limit starts no cooldown.
      #
      # timeout: 15s

      # Skip a failed pool or proxy for this duration. Range: 1s..10m.
      # If every entry is in cooldown, try the list in order again.
      #
      # cooldown: 30s

    # Client agent identifier sent in the Stratum login.
    #
    # agent: rilgate/<version>
    # timeout:
      # Timeout for connection setup and initial login response.
      #
      # connect: 5s

      # Maximum wait for the pool response to a submitted share. A locally valid
      # hash alone does not grant access with stratum_pool_accepted verification.
      #
      # submit: 20s
    # sessions:
      # Shared capacity for job connections and WebSocket verification sessions.
      # Range: 1..4096. Process-local. Capacity exhaustion returns 503.
      #
      # max: 64

      # Maximum lifetime of a WebSocket acceptance session, not a proof-token TTL.
      #
      # ttl: 15m
    # job_sessions:
      # pooled reuses difficulty-specific job connections. per_challenge opens
      # a connection per issued challenge. Both consume sessions.max capacity.
      #
      # mode: pooled

      # Maximum pooled job sessions. Range: 1..4096. At most sessions.max in pooled mode.
      # Not used as a pool size in per_challenge mode; zero is never a mode switch.
      #
      # max: 16

      # Pooled connection idle timeout since the last job request. Incoming job
      # notifications do not extend it. Not used in per_challenge mode.
      #
      # idle: 1m

################################### SIGNALS ###################################

# signals:
  # Named IP and ASN sets. Each registry permits 64 sets.
  # Each set takes exactly one source: cidrs/asns or url with format.
  #
  # ip_sets:
    # Example, not a default.
    #
    # office:
      # cidrs: [203.0.113.0/24, 2001:db8::/32]

    # Example, not a default.
    #
    # crawler-networks:
      # url: https://www.bing.com/toolbox/bingbot.json

      # Choose one format. Regex requires a capture group named value.
      #
      # format: ip_prefixes_json
      # format: list_text
      # format: {regex: '(?m)^(?P<value>[0-9.]+):\d+$'}
      # format: {json_path: ['$.prefixes[*].ipv4Prefix']}

      # Refresh interval. Range: 1h..7d. Default: 24h.
      #
      # refresh: 24h

      # Maximum snapshot age. Range: refresh..30d. Default: 7d.
      #
      # max_stale: 7d

    # Example, not a default.
    #
    # tor-exits:
      # url: https://check.torproject.org/torbulkexitlist
      # format: list_text
      # refresh: 1h
      # max_stale: 1d

  # asn_sets match the client ASN from signals.geoip.asn, so they need that database.
  #
  # asn_sets:
    # Example, not a default.
    #
    # trusted-networks:
      # asns: [15169, 13335]

    # Example, not a default.
    #
    # datacenter:
      # url: https://raw.githubusercontent.com/X4BNet/lists_vpn/main/input/datacenter/ASN.txt

      # Choose list_text, regex or json_path for ASN values.
      #
      # format: list_text
      # format: {regex: '(?m)^(?P<value>AS[0-9]+)$'}
      # format: {json_path: ['$.asns[*]']}

      # Refresh interval. Range: 1h..7d. Default: 24h.
      #
      # refresh: 24h

      # Maximum snapshot age. Range: refresh..30d. Default: 7d.
      #
      # max_stale: 7d

  # MaxMind databases behind the country and asn conditions. Each database takes exactly one source: path (a local .mmdb
  # file) or maxmind (a download of a GeoLite2 or GeoIP2 edition). A condition
  # that uses country or asn needs its database configured. Readiness fails
  # until each configured database has loaded once. Before then, and after
  # max_stale without a refresh, the conditions are unknown, so an allow rule
  # on them never allows and a deny rule challenges.
  #
  # geoip:
    # Country database source.
    #
    # country:
      # Example, not a default.
      #
      # path: /var/lib/rilgate/GeoLite2-Country.mmdb

      # Re-reads the file when its modification time changes.
      # Range: 1m..7d.
      #
      # refresh: 1h

    # ASN database source.
    #
    # asn:
      # MaxMind download source.
      #
      # maxmind:
        # Edition ID uses letters, digits and hyphens. Length: Range: 1..64.
        #
        # edition: GeoLite2-ASN

        # Example, not a default.
        #
        # account_id: "123456"

        # Redacted by `rilgate config show`. Read it from the environment so
        # the key stays out of version control.
        #
        # license_key: "${MAXMIND_LICENSE_KEY}"

      # Downloads stay under 128 MiB. Range: 1h..7d. Applies to maxmind sources.
      #
      # refresh: 24h

      # Longest age of a loaded database before conditions turn unknown.
      # Range: refresh..90d.
      #
      # max_stale: 30d

  # DNS lookups behind the dnsbl and client_ip.reverse_dns conditions. The first request from a new client can wait up to timeout
  # for its lookups. Later requests use the cache. A lookup that fails or times
  # out leaves the condition unknown, so an allow rule on it never allows and a
  # deny rule challenges. The servers come from the system configuration.
  #
  # dns:
    # Time one request waits for the lookups of its client. Range: 1ms..5s.
    #
    # timeout: 1s

    # Cache time of a listed address or a verified name. At least 1s.
    #
    # cache_ttl: 1h

    # Cache time of an unlisted address or an unverified client. At least 1s.
    #
    # negative_ttl: 10m

    # Range: 1..1048576.
    #
    # max_entries: 65536

  # Hidden link in the challenge and refresh pages. A
  # client that requests the link is flagged, and the condition honeypot: true
  # matches flagged clients. A flag covers one IPv4 address or one IPv6 /64, and
  # a request without a resolved client IP flags nobody. The link points to
  # {site.base_path}/trap/<random>, which answers like an unknown internal route.
  #
  # honeypot:
    # Time a client stays flagged. Range: 1s..30d.
    #
    # ttl: 24h

    # Range: 1..1048576. A full table drops expired flags, then the oldest.
    #
    # max_entries: 65536

  # Named request counters for custom policy rules. At most 32 counters; names
  # use ASCII letters, digits, - or _. Length: Range: 1..64. Rules read with rate.
  #
  # counters:
    # Named request counter example.
    #
    # pages:
      # Required key of unique parts. Range: 1..4. Also supports method, path, user_agent,
      # country, asn and {header: X-Name}. GeoIP parts require their databases.
      #
      # key: [client_ip, host]

      # Optional client_ip prefixes default to IPv4 /32 and IPv6 /64.
      #
      # key: [{client_ip: {ipv4_prefix: 24, ipv6_prefix: 48}}, host]

      # Required sliding window. Range: 1s..1h.
      #
      # window: 30s

      # Maximum keys in memory. Range: 1..1048576. Default: 65536.
      #
      # max_entries: 65536

      # Optional condition; absent selects every request that reaches the gate.
      # Only true counts. Excludes score, rate, dnsbl and client_ip.reverse_dns.
      #
      # count_when: {path: {prefix: /login}}

#################################### POLICY ###################################

# Select a preset:
#
# off: allow application traffic without proof enforcement.
# light: challenge empty or bot-like User-Agents with Fast difficulty 1.
# balanced: challenge application traffic with Fast difficulty 2.
# strict: challenge application traffic with Fast difficulty 4.
# crawler-protection: deny AI/headless crawlers, verify search crawlers and score clients.

# light, balanced and strict allow /robots.txt, /favicon.ico and ACME challenge paths.
# Without a policy section, Rilgate uses builtin:policies/balanced.yml.
#
# policy: !include builtin:policies/<name>.yml

# Customize a built-in policy with a map merge:
#
# signals:
#   ip_sets: !include builtin:signals/crawler-ip-sets.yml
#
# policy:
#   <<: !include builtin:policies/crawler-protection.yml
#   default_action: challenge

# policy:
  # Evaluated in declaration order.
  # allow, deny and challenge are terminal; score adjusts risk and continues.
  # Names must be unique, nonempty and at most 128 bytes. Rules plus thresholds
  # are limited to 128 entries. Score adjustments are signed 32-bit integers;
  # accumulated scores saturate instead of wrapping at integer limits.

  # Expression depth is limited to 16 and compiled condition nodes to 512.
  # Each text/pattern value is at most 2048 bytes, with a 64KiB total budget.
  # Regexes use Rust regex syntax with bounded compilation, no backreferences
  # or look-around. Invalid expressions fail startup validation.
  # Condition reference: docs/policy.md, section Conditions.
  #
  # Example, not a default.
  #
  # rules:
    # - name: public-endpoints

      # Any matching alternative allows these public machine-readable paths.
      #
      # Example, not a default.
      #
      # when:
        # any:
          # - path: {prefix: "/.well-known/"}
          # - path: {in: ["/favicon.ico", "/robots.txt"]}
          # - path: {regex: '(?i)\.(rss|xml|atom)$'}
      #
      # action: allow
    # - name: browser-score
      # Example, not a default.
      #
      # when:
        # user_agent: {regex: "Mozilla|Opera"}
      # action: score

      # Required only for action: score. Negative adjustments are also allowed.
      #
        # - name: heavy-scraper-sources
      # Example, not a default.
      #
      # when:
        # any:
          # - country: [CN, RU]
          # - asn: [16509, 14061]
          # - asn: {in_sets: [datacenter]}
      #
      # action: score
      # score: 5

    # - !include builtin:rules/tor-exit.yml
    # - name: verified-googlebot
      # Example, not a default.
      #
      # when:
        # client_ip: {reverse_dns: [googlebot.com, google.com]}
      # action: allow
    # - name: listed-source
      # Example, not a default.
      #
      # when: {dnsbl: dnsbl.dronebl.org}
      # action: score
      # score: 10
    # - name: link-followers
      # Example, not a default.
      #
      # when: {honeypot: true}
      # action: deny
    # - name: page-rate
      # Counter name plus eq, gt, gte, lt or lte on non-negative integers.
      # Example, not a default.
      #
      # when: {rate: {counter: pages, gte: 60}}
      # action: score
      # score: 20
  # score: 10
    # - name: suspicious-header
      # Example, not a default.
      #
      # when:
        # all:
          # - method: {exact: POST}
          # - headers: {X-Suspicious: {regex: ".+"}}
          # - not:
              #
              # client_ip: {cidr: 192.0.2.0/24}
      # action: score
      # score: 10
    # - name: protected-endpoint
      # Example, not a default.
      #
      # when:
        # path: {prefix: /protected/}
      # action: challenge

      # Allowed only with action: challenge. Omit this mapping or either field
      # to use the default algorithm or score-derived difficulty, respectively.
      #
      # challenge:
        # fast, hashwx, randomx or refresh. RandomX also requires pow.stratum_pool.
        #
        # algorithm: fast

        # Fast counts leading zero hexadecimal digits. Range: 1..64.
        # Each added digit multiplies expected work by 16.
        # RandomX: an integer of at least 1000. Refresh delay. Range: 1s..10s.
        #
        # difficulty: 2

  # score:
    # Starting signed 32-bit risk score, before ordered rules run.
    #
    # initial: 0
    # debug_header:
      # Development only; true is rejected in production. Allows clients to
      # replace the starting score through the named request header.
      #
      # enabled: false

      # Valid HTTP header name read only when debug_header.enabled is true.
      #
      # name: x-pow-weight

    # Evaluated after rules only if no terminal
    # action matched. First score >= min wins; min values must be strictly
    # descending and unique. Actions: allow, deny, challenge, never score.
    # The last threshold can omit min to match every score.
    # If none match, default_action applies. Challenge fields follow rule syntax.
    #
    # Example, not a default.
    #
    # thresholds:
      # - min: 20
        #
        # action: challenge
        # challenge: {algorithm: fast, difficulty: 4}
      # - min: 10
        #
        # action: challenge
        # challenge: {algorithm: fast, difficulty: 2}
      # - min: 1
        #
        # action: challenge
        # challenge: {algorithm: fast, difficulty: 1}
      # - action: challenge
        #
        # challenge: {algorithm: fast, difficulty: 1}

  # Final fallback when no terminal rule or score threshold matches.
  # Options: allow, deny, challenge. Default: allow.
  # A challenge uses default_algorithm and score-derived difficulty.
  #
  # default_action: allow
