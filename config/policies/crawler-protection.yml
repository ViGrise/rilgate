# Needs signals.ip_sets: !include builtin:signals/crawler-ip-sets.yml
default_action: allow
rules:
  - !include ../rules/deny-empty-user-agent.yml
  - !include ../rules/deny-domain-fronting.yml
  - !include ../rules/deny-headless-browsers.yml
  - !include ../rules/deny-ai-crawlers.yml
  - !include ../rules/googlebot.yml
  - !include ../rules/bingbot.yml
  - !include ../rules/applebot.yml
  - !include ../rules/duckduckbot.yml
  - !include ../rules/yandexbot.yml
  - !include ../rules/qwantbot.yml
  - !include ../rules/mojeekbot.yml
  - !include ../rules/ccbot.yml
  - !include ../rules/kagibot.yml
  - !include ../rules/marginalia-crawler.yml
  - !include ../rules/wikimedia-citation-fetchers.yml
  - !include ../rules/internet-archive.yml
  - !include ../rules/arquivo-pt.yml
  - !include ../rules/public-endpoints.yml
  - !include ../rules/client-score.yml
score:
  initial: 0
  debug_header:
    enabled: false
    name: x-pow-weight
  thresholds:
    - min: 30
      action: challenge
      challenge:
        algorithm: fast
        difficulty: 6
    - min: 20
      action: challenge
      challenge:
        algorithm: fast
        difficulty: 4
    - min: 10
      action: challenge
      challenge:
        algorithm: fast
        difficulty: 2
    - min: 1
      action: challenge
      challenge:
        algorithm: refresh
        difficulty: 1
