- name: browser-score
  when:
    user_agent:
      regex: 'Mozilla|Opera'
  action: score
  score: 10
- name: cloudflare-worker-score
  when:
    headers:
      CF-Worker: {regex: '.*'}
  action: score
  score: 15
- name: firefox-ai-score
  when:
    headers:
      X-Firefox-Ai: {regex: '.*'}
  action: score
  score: 5
