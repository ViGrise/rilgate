name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
    # Path filters do not apply to tag pushes, so releases always build.
    paths-ignore: ['**.md', 'docs/**']
  # The release-build label makes a pull request build every release file without publishing.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore: ['**.md', 'docs/**']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_DOCUMENTATION: https://platform.vigrise.com/docs/open-source-software/rilgate/getting-started/introduction
  IMAGE_VENDOR: ViGrise
jobs:
  version:
    name: Release version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Require the tag to match the package version
        run: |
          version="$(scripts/release/version.sh)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match workspace version $version"
            exit 1
          fi
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install native proxy dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang pkg-config libssl-dev
      - name: Prepare Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown --target wasm32v1-none
      # Only main writes the compile cache, so pull requests restore trusted artifacts and never publish their own.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test workspace and browser resources
        run: scripts/test.sh
  browser:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install native proxy dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang pkg-config libssl-dev
      - name: Prepare Rust toolchain
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown --target wasm32v1-none
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: browser
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test production flow in real browsers over HTTPS
        run: |
          cargo xtask build-wasm
          cargo xtask build-web
          cargo build --locked
          scripts/test/browser.sh --with-deps
  release-checks:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install native proxy dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang pkg-config libssl-dev wrk
      - name: Prepare Rust toolchain
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown --target wasm32v1-none
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the release binary
        run: scripts/build.sh --release
      - name: Test native RandomX reference vectors
        run: |
          cargo test -p randomx-core --release --locked --test vectors -- --ignored --test-threads=1
          cargo test -p rilgate-pow-randomx --release --locked --lib -- --ignored --test-threads=1
      - name: Check performance regression smoke workload
        run: |
          cargo build --release --locked -p rilgate-gateway --example null-upstream
          PERF_GATE_BINARY=target/release/rilgate PERF_GATE_DURATION=3s PERF_GATE_WARMUP=1s scripts/perf-gate.sh
  dependencies:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-deny
        env:
          CARGO_DENY_VERSION: 0.20.2
          CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          archive="cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl"
          curl -fsSL -o "$RUNNER_TEMP/$archive.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/$archive.tar.gz"
          echo "$CARGO_DENY_SHA256  $RUNNER_TEMP/$archive.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/$archive/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
      - name: Check licenses, bans and dependency sources
        run: cargo deny --locked --config .config/deny.toml check licenses sources bans
      - name: Check that each advisory has a tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/advisories.sh
  container:
    name: container - ${{ matrix.variant }}
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        include:
          # The Alpine image holds the static musl build and the Debian image the dynamic glibc build.
          - variant: alpine
            target: runtime-alpine
            scope: linux-amd64-static
          - variant: debian
            target: runtime-debian
            scope: linux-amd64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Lowercase image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      # Without a registry login the build reads no cache and compiles every layer.
      - uses: docker/login-action@v4
        continue-on-error: true
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Reads the layer cache that image builds on main write; this job never exports it.
      # The glibc scope also supplies the shared planner and asset stages.
      - name: Build the ${{ matrix.variant }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: ${{ matrix.target }}
          tags: rilgate:${{ matrix.variant }}-check
          load: true
          build-args: CARGO_BUILD_JOBS=4
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-buildcache:${{ matrix.scope }}
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-buildcache:linux-amd64
          # Runtime stages always rebuild so their OS packages include current security updates.
          no-cache-filters: ${{ matrix.target }}
      - name: Build the static binary
        if: matrix.variant == 'alpine'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: binary-musl
          outputs: type=local,dest=${{ runner.temp }}/binary-musl
          build-args: CARGO_BUILD_JOBS=4
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-buildcache:linux-amd64-static
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-buildcache:linux-amd64
      - name: Test the static binary without a C library
        if: matrix.variant == 'alpine'
        run: scripts/test/static-binary.sh "$RUNNER_TEMP/binary-musl/rilgate"
      - name: Validate Compose configuration
        if: matrix.variant == 'alpine'
        env:
          RILGATE_SECURITY_SECRET: ci-secret-with-at-least-32-random-bytes
        run: docker compose -f deploy/docker/compose.yml config --quiet
      - name: Test container lifecycle and dependency failures
        run: scripts/test/container.sh rilgate:${{ matrix.variant }}-check
      - name: Scan the image for fixable high and critical vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.0 image --ignore-unfixed --severity HIGH,CRITICAL \
            --exit-code 1 rilgate:${{ matrix.variant }}-check
      - name: Validate edge proxy configuration
        if: matrix.variant == 'alpine'
        run: |
          scratch="$(mktemp -d)"
          { printf 'events {}\nhttp {\n'; cat deploy/examples/nginx/nginx.conf; printf '\n}\n'; } > "$scratch/nginx.conf"
          docker run --rm -v "$scratch/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:stable nginx -t
          docker run --rm -v "$PWD/deploy/examples/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  # Linux binaries come from the image build: a dynamic glibc build on Debian bookworm
  # and a static musl build. Both contain the OpenSSL that pingora-openssl vendors.
  binaries:
    name: Build - ${{ matrix.platform }}
    env:
      RILGATE_BUILD_COMMIT: ${{ github.sha }}
      CROSS_BUILD_ENV_PASSTHROUGH: RILGATE_BUILD_COMMIT
    needs: [version, test, browser, release-checks, dependencies, container]
    # The version job runs only for tags, so a skipped dependency does not skip this job.
    if: ${{ !cancelled() && !failure() && (startsWith(github.ref, 'refs/tags/v') || contains(github.event.pull_request.labels.*.name, 'release-build')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26-intel
            platform: darwin-amd64
            binary: rilgate
          - os: macos-26
            platform: darwin-arm64
            binary: rilgate
          - os: windows-2025
            platform: windows-amd64
            binary: rilgate.exe
            msi: amd64
          - os: windows-11-arm
            platform: windows-arm64
            binary: rilgate.exe
            msi: arm64
          # Static Linux cross builds link musl with zig, and their smoke test runs
          # under QEMU user emulation.
          - os: ubuntu-26.04
            platform: linux-ppc64le-static
            binary: rilgate
            zigbuild: powerpc64le-unknown-linux-musl
            qemu: ppc64le
            linux-packages: ppc64le
          - os: ubuntu-26.04
            platform: linux-riscv64-static
            binary: rilgate
            zigbuild: riscv64gc-unknown-linux-musl
            qemu: riscv64
            linux-packages: riscv64
          # BSD builds compile in cross-rs containers. No runner can execute them.
          - os: ubuntu-26.04
            platform: freebsd-amd64
            binary: rilgate
            cross: x86_64-unknown-freebsd
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # OpenSSL's Configure needs a native Perl; the MSYS Perl that Git Bash puts
      # first on PATH lacks the modules it requires.
      - name: Use a native Perl for the OpenSSL build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perl = Get-Command perl.exe -All | Where-Object { $_.Source -notlike '*\Git\*' } | Select-Object -First 1
          if (-not $perl) { throw 'No native Perl found on PATH' }
          & $perl.Source -MIPC::Cmd -e 'print "perl $^V\n"'
          "OPENSSL_SRC_PERL=$($perl.Source)" >> $env:GITHUB_ENV
      - name: Build the browser solver and release binary
        if: matrix.cross == '' && matrix.zigbuild == ''
        run: |
          cargo xtask build-wasm
          cargo xtask build-web
          cargo build --release --locked -p rilgate --features vendored-openssl
      - name: Smoke test the binary
        if: matrix.cross == '' && matrix.zigbuild == ''
        env:
          RILGATE_SECURITY_SECRET: release-smoke-secret-with-at-least-32-bytes
        run: |
          binary="target/release/${{ matrix.binary }}"
          "$binary" --version
          "$binary" --config config/rilgate.production.yml config check
      - name: Install cross
        if: matrix.cross != ''
        env:
          CROSS_VERSION: 0.2.5
          CROSS_SHA256: 642375d1bcf3bd88272c32ba90e999f3d983050adf45e66bd2d3887e8e838bad
        run: |
          archive="$RUNNER_TEMP/cross.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/cross-rs/cross/releases/download/v$CROSS_VERSION/cross-x86_64-unknown-linux-gnu.tar.gz"
          echo "$CROSS_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$HOME/.cargo/bin" cross
      - name: Cross-build the browser solver and release binary
        if: matrix.cross != ''
        run: |
          cargo xtask build-wasm
          cargo xtask build-web
          cross build --release --locked -p rilgate --features vendored-openssl --target "${{ matrix.cross }}"
          mkdir -p target/release
          cp "target/${{ matrix.cross }}/release/rilgate" target/release/rilgate
      - name: Install zig and cargo-zigbuild
        if: matrix.zigbuild != ''
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --require-hashes -r scripts/release/zigbuild-requirements.txt
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"
          rustup target add "${{ matrix.zigbuild }}"
      - name: Cross-build the browser solver and static release binary
        if: matrix.zigbuild != ''
        run: |
          cargo xtask build-wasm
          cargo xtask build-web
          cargo zigbuild --release --locked -p rilgate --features vendored-openssl --target "${{ matrix.zigbuild }}"
          mkdir -p target/release
          cp "target/${{ matrix.zigbuild }}/release/rilgate" target/release/rilgate
      - name: Smoke test the static binary under QEMU
        if: matrix.qemu != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user
          "qemu-${{ matrix.qemu }}" target/release/rilgate --version
          "qemu-${{ matrix.qemu }}" target/release/rilgate --config config/rilgate.yml config check
      - name: Package
        run: scripts/release/package.sh "target/release/${{ matrix.binary }}" "${{ matrix.platform }}" dist
      - name: Install Linux packaging tools
        if: matrix.linux-packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools
          scripts/release/install-nfpm.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build Linux packages
        if: matrix.linux-packages != ''
        run: scripts/release/linux-packages.sh target/release/rilgate "${{ matrix.linux-packages }}" "$(scripts/release/version.sh)" dist
      - name: Install WiX
        if: matrix.msi != ''
        run: |
          dotnet tool install --global wix --version 5.0.2
          cygpath -w "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Build the Windows installer
        if: matrix.msi != ''
        run: scripts/release/windows-msi.sh target/release/rilgate.exe "${{ matrix.msi }}" "$(scripts/release/version.sh)" dist
      - uses: actions/upload-artifact@v7
        with:
          name: rilgate-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  image:
    name: Image - ${{ matrix.variant }} ${{ matrix.arch }}
    needs: [test, browser, release-checks, dependencies, container]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch: [amd64, arm64]
        variant: [debian, alpine]
        include:
          - arch: amd64
            os: ubuntu-26.04
          - arch: arm64
            os: ubuntu-26.04-arm
          # The Debian image holds the dynamic glibc build and the Alpine image the static musl build.
          - variant: debian
            target: runtime-debian
            binary-target: binary
            build: ''
          - variant: alpine
            target: runtime-alpine
            binary-target: binary-musl
            build: '-static'
    steps:
      - uses: actions/checkout@v7
      - name: Lowercase image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.documentation=${{ env.IMAGE_DOCUMENTATION }}
            org.opencontainers.image.vendor=${{ env.IMAGE_VENDOR }}
            org.opencontainers.image.authors=${{ env.IMAGE_VENDOR }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          target: ${{ matrix.target }}
          build-args: |
            CARGO_BUILD_JOBS=4
            RILGATE_BUILD_COMMIT=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          # Each build keeps its own cache scope; the glibc scope also supplies the shared planner and asset stages.
          # The cache lives in the registry, outside the size limit of the Actions cache.
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-buildcache:linux-${{ matrix.arch }}${{ matrix.build }}
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-buildcache:linux-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-buildcache:linux-${{ matrix.arch }}${{ matrix.build }},mode=max,image-manifest=true,oci-mediatypes=true
          no-cache-filters: ${{ matrix.target }}
      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.variant }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
      - name: Export the release binary
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            CARGO_BUILD_JOBS=4
            RILGATE_BUILD_COMMIT=${{ github.sha }}
          target: ${{ matrix.binary-target }}
          outputs: type=local,dest=${{ runner.temp }}/binary
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-buildcache:linux-${{ matrix.arch }}${{ matrix.build }}
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-buildcache:linux-${{ matrix.arch }}
      - name: Smoke test the glibc binary on the oldest supported Debian
        if: startsWith(github.ref, 'refs/tags/v') && matrix.variant == 'debian'
        env:
          RILGATE_SECURITY_SECRET: release-smoke-secret-with-at-least-32-bytes
        run: |
          docker run --rm -e RILGATE_SECURITY_SECRET -v "$RUNNER_TEMP/binary/rilgate:/usr/local/bin/rilgate:ro" \
            -v "$PWD/config:/config:ro" debian:bookworm-slim \
            sh -c 'rilgate --version && rilgate --config /config/rilgate.production.yml config check'
      - name: Test the static binary without a C library
        if: startsWith(github.ref, 'refs/tags/v') && matrix.variant == 'alpine'
        run: scripts/test/static-binary.sh "$RUNNER_TEMP/binary/rilgate"
      - name: Package the binary
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/release/package.sh "$RUNNER_TEMP/binary/rilgate" "linux-${{ matrix.arch }}${{ matrix.build }}" dist
      # Distribution packages hold the static build, so one package runs on every distribution.
      - name: Install Linux packaging tools
        if: startsWith(github.ref, 'refs/tags/v') && matrix.variant == 'alpine'
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools
          scripts/release/install-nfpm.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build Linux packages
        if: startsWith(github.ref, 'refs/tags/v') && matrix.variant == 'alpine'
        run: scripts/release/linux-packages.sh "$RUNNER_TEMP/binary/rilgate" "${{ matrix.arch }}" "$(scripts/release/version.sh)" dist
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: rilgate-linux-${{ matrix.arch }}${{ matrix.build }}
          path: dist/*
          if-no-files-found: error

  manifest:
    name: Image - manifest ${{ matrix.variant }}
    needs: image
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # One index carries every tag of an image, so its tags share a digest. The Alpine
          # image takes the unsuffixed tags and the same tags with -alpine. A stable release
          # also moves the alias tag of each image, such as alpine.
          - variant: alpine
            tag-suffixes: '["", "-alpine"]'
            alias: alpine
          - variant: debian
            tag-suffixes: '["-debian"]'
            alias: debian
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ matrix.variant }}-*
          merge-multiple: true
      - name: Lowercase image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          # Registries read the description of a multi-architecture image from its index.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha,prefix=sha-
      - name: Create and push manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
          TAG_SUFFIXES: ${{ matrix.tag-suffixes }}
          ALIAS: ${{ matrix.alias }}
        # Suffixes go on the tags only, so the version annotation stays the release version.
        run: |
          tags="$(jq -cr --argjson suffixes "$TAG_SUFFIXES" '[.tags[] as $tag | $suffixes[] | "-t " + $tag + .] | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          if [[ -n "$ALIAS" && "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != *-* ]]; then
            tags+=" -t $REGISTRY/$IMAGE_NAME:$ALIAS"
          fi
          mapfile -t annotations < <(jq -r '.annotations[] | "--annotation=" + .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          # Copies the remaining OCI labels of the image, such as the base image and vendor, to the index.
          source="$REGISTRY/$IMAGE_NAME@sha256:$(ls | head -n 1)"
          mapfile -t -O "${#annotations[@]}" annotations < <(docker buildx imagetools inspect "$source" --format '{{json .Image}}' | jq -r --argjson known "$DOCKER_METADATA_OUTPUT_JSON" '
            (if has("config") then . else (to_entries | map(select(.key != "unknown/unknown")) | .[0].value) end).config.Labels // {}
            | to_entries[] | select(.key | startswith("org.opencontainers.image."))
            | select(("index:" + .key) as $key | ($known.annotations | map(split("=")[0]) | index($key)) | not)
            | "--annotation=index:" + .key + "=" + .value')
          docker buildx imagetools create "${annotations[@]}" $tags $(printf "$REGISTRY/$IMAGE_NAME@sha256:%s " *)
      - name: Inspect manifest
        env:
          TAG_SUFFIXES: ${{ matrix.tag-suffixes }}
        run: docker buildx imagetools inspect "$REGISTRY/$IMAGE_NAME:${{ steps.meta.outputs.version }}$(jq -r '.[-1]' <<< "$TAG_SUFFIXES")"

  source:
    name: Source archive
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.pull_request.labels.*.name, 'release-build')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Package the source with vendored dependencies
        run: scripts/release/source.sh "$(scripts/release/version.sh)" dist
      - uses: actions/upload-artifact@v7
        with:
          name: rilgate-src-vendor
          path: dist/*
          if-no-files-found: error

  release:
    name: Release
    needs: [version, binaries, manifest, source]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: rilgate-*
          merge-multiple: true
      - name: Checksum release files
        working-directory: dist
        run: sha256sum rilgate* > SHA256SUMS && cat SHA256SUMS
      - name: Sign release files
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          cp install.sh install.ps1 dist/
          scripts/release/sign.sh dist
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
