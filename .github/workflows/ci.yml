name: CI
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  version:
    name: Release version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Require the tag to match the package version
        run: |
          version="$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match workspace version $version"
            exit 1
          fi
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install native proxy dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang pkg-config libssl-dev
      - name: Prepare Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Test workspace and browser resources
        run: scripts/test.sh
      - name: Test production flow in real browsers over HTTPS
        run: |
          cargo build --locked
          scripts/test/browser.sh --with-deps
      - name: Test native RandomX reference vectors
        run: |
          cargo test -p randomx-core --release --locked --test vectors -- --ignored --test-threads=1
          cargo test -p rilgate-pow-randomx --release --locked --lib -- --ignored --test-threads=1
      - name: Check performance regression smoke workload
        run: |
          sudo apt-get update && sudo apt-get install -y wrk
          scripts/build.sh --release
          PERF_GATE_BINARY=target/release/rilgate PERF_GATE_DURATION=3s PERF_GATE_WARMUP=1s scripts/perf-gate.sh
  dependencies:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Check advisories, licenses and dependency sources
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny --locked --config .config/deny.toml check advisories licenses sources bans
  container:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build production image
        run: docker build -f deploy/docker/Dockerfile -t rilgate:production-check .
      - name: Validate Compose configuration
        env:
          RILGATE_SECURITY_SECRET: ci-secret-with-at-least-32-random-bytes
        run: docker compose -f deploy/docker/compose.yml config --quiet
      - name: Test container lifecycle and dependency failures
        run: scripts/test/container.sh
      - name: Scan image for fixable high and critical vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.0 image --ignore-unfixed --severity HIGH,CRITICAL \
            --exit-code 1 rilgate:production-check
      - name: Validate edge proxy configuration
        run: |
          scratch="$(mktemp -d)"
          { printf 'events {}\nhttp {\n'; cat deploy/examples/nginx/nginx.conf; printf '\n}\n'; } > "$scratch/nginx.conf"
          docker run --rm -v "$scratch/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:stable nginx -t
          docker run --rm -v "$PWD/deploy/examples/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  # Linux binaries come from the image builder stage, so they share the image's
  # Debian toolchain, glibc baseline and system OpenSSL 3.
  binaries:
    name: Build - ${{ matrix.platform }}
    needs: [version, test, dependencies, container]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26-intel
            platform: darwin-amd64
            binary: rilgate
          - os: macos-26
            platform: darwin-arm64
            binary: rilgate
          - os: windows-2025
            platform: windows-amd64
            binary: rilgate.exe
          - os: windows-11-arm
            platform: windows-arm64
            binary: rilgate.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # OpenSSL's Configure needs a native Perl; the MSYS Perl that Git Bash puts
      # first on PATH lacks the modules it requires.
      - name: Use a native Perl for the OpenSSL build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perl = Get-Command perl.exe -All | Where-Object { $_.Source -notlike '*\Git\*' } | Select-Object -First 1
          if (-not $perl) { throw 'No native Perl found on PATH' }
          & $perl.Source -MIPC::Cmd -e 'print "perl $^V\n"'
          "OPENSSL_SRC_PERL=$($perl.Source)" >> $env:GITHUB_ENV
      - name: Build the browser solver and release binary
        run: |
          cargo xtask build-wasm
          cargo build --release --locked -p rilgate --features vendored-openssl
      - name: Smoke test the binary
        env:
          RILGATE_SECURITY_SECRET: release-smoke-secret-with-at-least-32-bytes
        run: |
          binary="target/release/${{ matrix.binary }}"
          "$binary" --version
          "$binary" --config config/rilgate.production.yml config check
      - name: Package
        run: scripts/release/package.sh "target/release/${{ matrix.binary }}" "${{ matrix.platform }}" dist
      - uses: actions/upload-artifact@v7
        with:
          name: rilgate-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  image:
    name: Image - ${{ matrix.arch }}
    needs: [test, dependencies, container]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - os: ubuntu-26.04
            arch: amd64
          - os: ubuntu-26.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v7
      - name: Lowercase image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: CARGO_BUILD_JOBS=4
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          cache-from: type=gha,scope=linux-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=linux-${{ matrix.arch }}
      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
      - name: Export the release binary
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: CARGO_BUILD_JOBS=4
          target: binary
          outputs: type=local,dest=${{ runner.temp }}/binary
          cache-from: type=gha,scope=linux-${{ matrix.arch }}
      - name: Smoke test and package the binary
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RILGATE_SECURITY_SECRET: release-smoke-secret-with-at-least-32-bytes
        run: |
          binary="$RUNNER_TEMP/binary/rilgate"
          docker run --rm -e RILGATE_SECURITY_SECRET -v "$binary:/usr/local/bin/rilgate:ro" \
            -v "$PWD/config:/config:ro" debian:bookworm-slim \
            sh -c 'apt-get update -qq && apt-get install -y -qq --no-install-recommends libssl3 >/dev/null \
              && rilgate --version && rilgate --config /config/rilgate.production.yml config check'
          scripts/release/package.sh "$binary" "linux-${{ matrix.arch }}" dist
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: rilgate-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  manifest:
    name: Image - manifest
    needs: image
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - name: Lowercase image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha,prefix=sha-
      - name: Create and push manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$REGISTRY/$IMAGE_NAME@sha256:%s " *)
      - name: Inspect manifest
        run: docker buildx imagetools inspect "$REGISTRY/$IMAGE_NAME:${{ steps.meta.outputs.version }}"

  release:
    name: Release
    needs: [version, binaries, manifest]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: rilgate-*
          merge-multiple: true
      - name: Checksum release archives
        working-directory: dist
        run: sha256sum rilgate-* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
            install.sh
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
