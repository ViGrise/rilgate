name: Advisories
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  advisories:
    name: Check dependency advisories
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Check advisories against the committed lockfile
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny --locked --config .config/deny.toml check advisories
