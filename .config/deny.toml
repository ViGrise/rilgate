[graph]
all-features = true

[advisories]
ignore = [
  { id = "RUSTSEC-2024-0388", reason = "Pingora requires derivative; replacing its derive implementation requires upstream support. This is a maintenance advisory." },
  { id = "RUSTSEC-2024-0449", reason = "YAML is restricted to operator-owned startup configuration. Pingora and serde_yaml_ng retain unsafe-libyaml; no patched version exists for this maintenance advisory." },
]

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "BSD-2-Clause",
  "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "CC0-1.0",
  "Unlicense", "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates are private and share the [workspace.package] version, so their
# path dependencies carry no version requirement.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
