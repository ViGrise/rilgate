[workspace]
members = [
  "crates/rilgate",
  "crates/rilgate-core",
  "crates/rilgate-gateway",
  "crates/rilgate-challenge",
  "crates/rilgate-dns",
  "crates/rilgate-ip-feeds",
  "crates/rilgate-pow-randomx",
  "crates/rilgate-pow-hash",
  "crates/rilgate-pow-hashwx",
  "crates/rilgate-pool",
  "crates/rilgate-stratum",
  "crates/rilgate-policy",
  "crates/rilgate-protocol",
  "crates/rilgate-crypto",
  "crates/rilgate-telemetry",
  "crates/rilgate-test-utils",
  "crates/rilgate-config",
  "crates/rilgate-pow",
  "crates/rilgate-web",
  "crates/randomx-core",
  "crates/hashwx-core",
  "crates/hashwx-wasm",
  "crates/randomx-wasm",
  "crates/xtask",
]
default-members = ["crates/rilgate"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
rilgate-core = { path = "crates/rilgate-core" }
rilgate-gateway = { path = "crates/rilgate-gateway" }
rilgate-challenge = { path = "crates/rilgate-challenge" }
rilgate-dns = { path = "crates/rilgate-dns" }
rilgate-ip-feeds = { path = "crates/rilgate-ip-feeds" }
rilgate-pow-randomx = { path = "crates/rilgate-pow-randomx" }
rilgate-pow-hash = { path = "crates/rilgate-pow-hash" }
rilgate-pow-hashwx = { path = "crates/rilgate-pow-hashwx" }
rilgate-pool = { path = "crates/rilgate-pool" }
rilgate-stratum = { path = "crates/rilgate-stratum" }
rilgate-policy = { path = "crates/rilgate-policy" }
rilgate-protocol = { path = "crates/rilgate-protocol" }
rilgate-crypto = { path = "crates/rilgate-crypto" }
rilgate-telemetry = { path = "crates/rilgate-telemetry" }
rilgate-test-utils = { path = "crates/rilgate-test-utils" }

randomx-core = { path = "crates/randomx-core" }

rilgate-config = { path = "crates/rilgate-config" }
rilgate-pow = { path = "crates/rilgate-pow" }
rilgate-web = { path = "crates/rilgate-web" }

# pingora-core 0.9 creates zero-capacity stream buffers, which tokio 1.54 and later reject.
tokio = { version = ">=1.53.3, <1.54", features = ["full"] }
axum = { version = "0.8.9", features = ["ws"] }
hyper = { version = "1.11.0", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
bytes = "1"
async-trait = "0.1"
mimalloc = { version = "0.1.52", default-features = false }
pingora = { version = "0.9.0", features = ["proxy", "openssl"] }
http-body = "1"
http-body-util = "0.1.5"
tower = "0.5.3"

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }

serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
clap = { version = "4.6.4", features = ["derive", "env"] }
dotenvy = "0.15.7"
uuid = { version = "1.24.0", features = ["v4", "v7", "fast-rng", "serde"] }

anyhow = "1.0.104"
libc = "0.2"
thiserror = "2.0.19"
futures-util = "0.3.31"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

moka = { version = "0.12.16", features = ["future"] }
html-escape = "0.2.15"

reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream"] }

hmac = "0.12.1"
sha2 = { version = "0.10.9", default-features = false }
base64 = "0.22.1"
hex = "0.4.3"
semver = "1"
regex = "1.12.2"

humantime = "2"
maxminddb = "0.32"
hickory-resolver = "0.26"
flate2 = "1.1"
tar = "0.4"

http = "1"
url = "2"

arc-swap = "1"
humantime-serde = "1"
fastrand = "2"
include_dir = "0.7"
minijinja = { version = "2", features = ["loader", "json", "fuel"] }
mime_guess = "2"
notify = "8"
tempfile = "3"
socket2 = "0.6"
tokio-util = { version = "0.7", features = ["io"] }
cap-std = "4"
language-tags = "0.3"
tokio-tungstenite = "0.29.0"

# The gateway is CPU-bound per request (token signing, template rendering, JSON),
# so cross-crate inlining matters more here than build time. The wasm artifact
# gets its own settings from crates/xtask via CARGO_PROFILE_RELEASE_* env
# overrides, which take precedence over this table.
#
# panic stays on unwind: web snapshot builds and reloads run under
# spawn_blocking, and under abort a panic in one of those would take down the
# process rather than only its task.
[profile.release]
lto = "thin"
codegen-units = 1
