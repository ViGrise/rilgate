[package]
name = "hashwx-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Raw wasm32 ABI for HashWX interpretation and module generation"

[lib]
crate-type = ["cdylib"]

[dependencies]
hashwx-core = { path = "../hashwx-core" }
sha2.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
dlmalloc = { version = "0.2", features = ["global"] }

[dev-dependencies]
wasmparser = "0.240"
