[package]
name = "randomx-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Raw wasm32 ABI for the workspace RandomX implementation"

[lib]
crate-type = ["cdylib"]

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
randomx-core = { workspace = true }

[features]
validation = ["randomx-core/validation"]

[dev-dependencies]
wasmparser = "0.240"
