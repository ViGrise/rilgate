[package]
name = "rilgate"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "rilgate"
path = "src/main.rs"

[features]
# Builds and statically links OpenSSL, so release binaries for platforms without
# a system OpenSSL 3 (macOS, Windows) run without a separate installation.
vendored-openssl = ["dep:openssl"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
dotenvy.workspace = true
tokio.workspace = true
socket2.workspace = true
hyper = { workspace = true, features = ["server"] }
hyper-util.workspace = true
http-body-util.workspace = true
bytes.workspace = true
http.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
rilgate-core.workspace = true
tracing.workspace = true
rilgate-config.workspace = true
rilgate-gateway.workspace = true
rilgate-challenge.workspace = true
rilgate-ip-feeds.workspace = true
rilgate-pool.workspace = true
rilgate-pow.workspace = true
rilgate-pow-hash.workspace = true
rilgate-pow-randomx.workspace = true
rilgate-web.workspace = true
rilgate-telemetry.workspace = true
reqwest.workspace = true
semver.workspace = true
serde_yaml_ng.workspace = true
sha2.workspace = true
hex.workspace = true
openssl = { version = "0.10", optional = true, features = ["vendored"] }

[dev-dependencies]
rilgate-protocol.workspace = true
openssl = "0.10"
randomx-core.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
axum.workspace = true
rilgate-test-utils.workspace = true
tower.workspace = true
tempfile.workspace = true
